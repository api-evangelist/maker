aid: maker
name: Maker
description: >-
  Maker (the Maker Protocol / MakerDAO) is a decentralized finance protocol on
  Ethereum that issues the Dai and USDS stablecoins against on-chain collateral,
  governed by holders of the MKR governance token. a16z crypto is a long-standing
  backer, having acquired a significant share of the MKR supply. The protocol is
  transitioning to the Sky ecosystem (Sky Protocol, USDS, and the SKY token). Its
  developer surface is on-chain: Ethereum smart contracts documented for
  integrators, a Chainlog contract registry, and a governance Vote Data API,
  rather than a traditional hosted REST/OpenAPI product. This profile captures
  Maker/Sky's public developer, documentation, and security surface for the API
  Evangelist network.
