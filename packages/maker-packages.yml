note: >-
  dai.js and its plugins are the first-party MakerDAO JavaScript SDK for
  interacting with the Maker Protocol (Multi-Collateral Dai) on Ethereum.
  Published under the org-owned @makerdao npm scope. These libraries predate the
  Sky rebrand (latest activity ~2022-2025) and cover the legacy MCD contract
  surface; the current Sky ecosystem developer surface (developers.skyeco.com)
  is on-chain smart contracts with no new hosted client SDK published as of this
  pass.
